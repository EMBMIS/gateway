name: Bug report
description: Something does not work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest set of steps, commands or requests that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: e.g. v1.0.0 or a commit id
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, Node.js version, Docker or not, database.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant log output. Remove keys, passwords and personal data first.
      render: text
